<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>PL Strength</title>
    <meta name="theme-color" content="#7a0f18" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PL Strength" />
  </head>
  <body>
    <div id="root"></div>
    <!-- No service worker registration in dev. Vite injects the module below. -->
    <script>
      (function seedFirebaseConfig() {
        const cfg = {
          apiKey: "%VITE_FIREBASE_API_KEY%",
          authDomain: "%VITE_FIREBASE_AUTH_DOMAIN%",
          projectId: "%VITE_FIREBASE_PROJECT_ID%",
          storageBucket: "%VITE_FIREBASE_STORAGE_BUCKET%",
          messagingSenderId: "%VITE_FIREBASE_MESSAGING_SENDER_ID%",
          appId: "%VITE_FIREBASE_APP_ID%",
          measurementId: "%VITE_FIREBASE_MEASUREMENT_ID%",
        };
        const invalid = (value) =>
          !value ||
          value === "undefined" ||
          (typeof value === "string" && value.startsWith("%VITE_"));
        if (invalid(cfg.apiKey) || invalid(cfg.projectId)) {
          return;
        }
        Object.keys(cfg).forEach((key) => {
          if (invalid(cfg[key])) {
            delete cfg[key];
          }
        });
        window.__FBCONFIG__ = cfg;
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
